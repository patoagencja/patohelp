name: External cron (data sync + alerts + news)

# Reliable scheduler independent of Vercel Cron. Pings the app's cron endpoints
# with the CRON_SECRET bearer token. Requires two repo secrets:
#   CRON_SECRET   - same value as the Vercel env var
#   APP_URL       - e.g. https://patohelp-two.vercel.app  (optional; defaults below)
#
# ONE schedule on purpose. The previous setup had a second daily cron entry and
# gated the news/summary step on `github.event.schedule == '30 4 * * *'` -
# GitHub coalesces/drops extra schedules on busy workflows, so that step never
# ran and nobody noticed (curl also swallowed HTTP 500s, keeping runs green).
# Now every endpoint is pinged each run and the DAILY routes themselves are
# idempotent per day (refresh-news: one prasówka/day, generated after 6:00 PL;
# generate-summary: one summary per client per day), so the 30-minute cadence
# costs one cheap DB check. A job that still fails after a retry turns the run
# RED so breakage is visible instead of silently going stale for weeks.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}      # manual "Run workflow" button

# No concurrency group on purpose. With one, a tick that arrived while another
# run was still going got QUEUED and then cancelled by the next tick - the
# "All jobs were cancelled" failure alerts. timeout-minutes (15) is far below
# the 30-minute cadence, so runs cannot overlap in practice, and every endpoint
# is idempotent even if they did.
#
# LOGS ARE PUBLIC (public repo). Response bodies carry client ids, ad account
# ids and error texts, so every job prints only the HTTP status, the
# top-level numbers / booleans of the body (counts, "ok") and the LENGTH of
# its `errors` array, if it has one - never the body.
#
# The Meta-heavy jobs start staggered (data sync at once - refresh-ads-meta
# first -, ad sets after 60 s, creative tests after 150 s): Meta's limits are
# per ad account, and three heavy readers hitting the same accounts in the
# same second is what trips them.
#
# Retries: an endpoint is called a second time only when the first call got
# no answer at all (connection error) or a 5xx. Never after curl's own
# timeout (exit 28): the function is then most likely still running, and the
# retry started a second, overlapping run of it - on the same Meta accounts,
# which is what tripped the rate limits.

env:
  # Status line of a response (public logs): numbers and booleans, plus the
  # number of entries in `errors` (the texts carry client data).
  SUMMARY_JQ: 'if type == "object" then with_entries(select(.value | type == "number" or type == "boolean")) + (if (.errors | type) == "array" then {errors: (.errors | length)} else {} end) else {} end'
  ERRORS_JQ: 'if type == "object" and (.errors | type) == "array" then (.errors | length) else 0 end'

jobs:
  sync:
    runs-on: ubuntu-latest
    # Hard cap well under the 30-minute cadence. Without it a hanging endpoint
    # (curl -m 300, retried) burned 10+ minutes, runs started overlapping the
    # schedule, and the concurrency group then CANCELLED the queued run -
    # the "All jobs were cancelled" notifications. One attempt of every
    # endpoint at its full curl limit is ~11 min.
    timeout-minutes: 15
    env:
      APP_URL: ${{ secrets.APP_URL || 'https://patohelp-two.vercel.app' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Guard - secret present
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repo secret is missing"; exit 1
          fi

      # Fast, idempotent data pulls. These must stay green - a failure here
      # means the dashboard is going stale, so it turns the run red.
      - name: Data sync (ads, ga4, creatives, demographics)
        run: |
          summary() {
            jq -c "$SUMMARY_JQ" /tmp/body 2>/dev/null | head -c 300 || true
          }
          # call_endpoint <job> [max seconds]: retry policy in the header.
          call_endpoint() {
            job=$1; max=${2:-90}
            for attempt in 1 2; do
              rm -f /tmp/body
              rc=0
              code=$(curl -sS -m "$max" -o /tmp/body -w "%{http_code}" \
                -H "Authorization: Bearer $CRON_SECRET" \
                "$APP_URL/api/cron/$job" 2>/dev/null) || rc=$?
              [ -n "$code" ] || code=000
              echo "-> $job (attempt $attempt): HTTP $code $(summary)"
              errs=$(jq -r "$ERRORS_JQ" /tmp/body 2>/dev/null || echo 0)
              if [ "${errs:-0}" -gt 0 ] 2>/dev/null; then
                echo "::warning::$job reported $errs error(s) in its response"
              fi
              if [ "$code" -ge 200 ] && [ "$code" -lt 400 ]; then return 0; fi
              if [ "$rc" -eq 28 ]; then
                echo "::warning::$job timed out after ${max} s - not retried (it is probably still running)"
                return 1
              fi
              # 4xx (bad secret, missing route): a retry gets the same answer.
              if [ "$code" != "000" ] && [ "$code" -lt 500 ]; then return 1; fi
              if [ "$attempt" -eq 1 ]; then sleep 5; fi
            done
            return 1
          }
          failed=""
          # refresh-ads-meta: 70 s deadline + the history turn + a Meta
          # request still in flight (60 s timeout) - 90 s turned healthy
          # runs red. refresh-demographics has its own longer budget.
          for spec in refresh-ads-meta:150 refresh-ads-google:90 refresh-ads-tiktok:90 \
                      refresh-ga4:90 refresh-creatives-meta:90 refresh-demographics:125; do
            job=${spec%%:*}; max=${spec##*:}
            if ! call_endpoint "$job" "$max"; then failed="$failed $job"; fi
          done
          if [ -n "$failed" ]; then
            echo "::error::Data sync failed:$failed"
            exit 1
          fi

  # Alerts in a job of their own. As the last two endpoints of `sync` they
  # were the first thing the 12-minute job limit cut whenever the platform
  # was slow (8 endpoints x 2 attempts x 95 s). They work from what is
  # already in the database, so they need not wait for this tick's sync.
  # Same retry policy and red-on-failure as the data sync.
  alerts:
    runs-on: ubuntu-latest
    # 2 endpoints x up to 2 attempts (notify-alerts may take 120 s) + start-up.
    timeout-minutes: 10
    env:
      APP_URL: ${{ secrets.APP_URL || 'https://patohelp-two.vercel.app' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Guard - secret present
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repo secret is missing"; exit 1
          fi

      - name: Alerts (evaluate, then notify)
        run: |
          summary() {
            jq -c "$SUMMARY_JQ" /tmp/body 2>/dev/null | head -c 300 || true
          }
          # call_endpoint <job> [max seconds]: retry policy in the header.
          call_endpoint() {
            job=$1; max=${2:-90}
            for attempt in 1 2; do
              rm -f /tmp/body
              rc=0
              code=$(curl -sS -m "$max" -o /tmp/body -w "%{http_code}" \
                -H "Authorization: Bearer $CRON_SECRET" \
                "$APP_URL/api/cron/$job" 2>/dev/null) || rc=$?
              [ -n "$code" ] || code=000
              echo "-> $job (attempt $attempt): HTTP $code $(summary)"
              errs=$(jq -r "$ERRORS_JQ" /tmp/body 2>/dev/null || echo 0)
              if [ "${errs:-0}" -gt 0 ] 2>/dev/null; then
                echo "::warning::$job reported $errs error(s) in its response"
              fi
              if [ "$code" -ge 200 ] && [ "$code" -lt 400 ]; then return 0; fi
              if [ "$rc" -eq 28 ]; then
                echo "::warning::$job timed out after ${max} s - not retried (it is probably still running)"
                return 1
              fi
              # 4xx (bad secret, missing route): a retry gets the same answer.
              if [ "$code" != "000" ] && [ "$code" -lt 500 ]; then return 1; fi
              if [ "$attempt" -eq 1 ]; then sleep 5; fi
            done
            return 1
          }
          failed=""
          # Evaluate first: notify sends what evaluation found. notify-alerts
          # has maxDuration 120, so its call may take that long.
          call_endpoint evaluate-alerts || failed="$failed evaluate-alerts"
          call_endpoint notify-alerts 125 || failed="$failed notify-alerts"
          if [ -n "$failed" ]; then
            echo "::error::Alerts failed:$failed"
            exit 1
          fi

  # Ad set / ad group rows for ad set goals. Own job and own endpoint: it can
  # take minutes on a big account and must never delay or redden data sync.
  adsets:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      APP_URL: ${{ secrets.APP_URL || 'https://patohelp-two.vercel.app' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Ad set sync - best effort
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET missing"; exit 0; fi
          # Let refresh-ads-meta (data sync) get its start on the same
          # Meta accounts first.
          sleep 60
          code=$(curl -sS -m 290 -o /tmp/body -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/refresh-adsets" 2>/dev/null || echo "000")
          # Status, top-level counts, errors count only (public logs, see the header).
          counts=$(jq -c "$SUMMARY_JQ" /tmp/body 2>/dev/null | head -c 300 || true)
          echo "-> refresh-adsets: HTTP $code $counts"
          if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
            echo "::warning::Ad set sync HTTP $code"
          fi
          errs=$(jq -r "$ERRORS_JQ" /tmp/body 2>/dev/null || echo 0)
          if [ "${errs:-0}" -gt 0 ] 2>/dev/null; then
            echo "::warning::Ad set sync reported $errs error(s)"
          fi

  # Ad x day rows with purchases for creative A/B tests (seasonal and
  # e-commerce clients only). Every tick on purpose: an owner spending tens of
  # thousands a day must see a losing ad within hours. Own job like ad sets:
  # a long backfill takes minutes and must never delay or redden data sync.
  creative-tests:
    runs-on: ubuntu-latest
    # 150 s stagger + up to 290 s of request + runner start-up.
    timeout-minutes: 10
    env:
      APP_URL: ${{ secrets.APP_URL || 'https://patohelp-two.vercel.app' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Ad-level sync - best effort
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET missing"; exit 0; fi
          # After refresh-ads-meta and the ad sets have started on the same
          # Meta accounts (Vercel runs this endpoint at :20/:50 as well).
          sleep 150
          code=$(curl -sS -m 290 -o /tmp/body -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/refresh-ads-meta-ads" 2>/dev/null || echo "000")
          # Status, top-level counts, errors count only (public logs, see the header).
          counts=$(jq -c "$SUMMARY_JQ" /tmp/body 2>/dev/null | head -c 300 || true)
          echo "-> refresh-ads-meta-ads: HTTP $code $counts"
          if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
            echo "::warning::Ad-level sync HTTP $code"
          fi

  # SEPARATE JOB on purpose. These used to be a final step of `sync`, where a
  # slow data sync (8 endpoints x up to 90s x 2 attempts = up to 24 min) could
  # blow the 12-minute job timeout and kill the run BEFORE news ever ran - which
  # is why the feed filled only every few days. Running in parallel means data
  # sync can never starve them.
  ai:
    runs-on: ubuntu-latest
    # 4 jobs x up to 180 s (curl -m 180) = 12 min + runner start-up; 10 cut
    # season-pulse, the last one, whenever the others ran long.
    timeout-minutes: 15
    env:
      APP_URL: ${{ secrets.APP_URL || 'https://patohelp-two.vercel.app' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Guard - secret present
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repo secret is missing"; exit 1
          fi

      # Self-healing: each tick fills the next missing news category, and the
      # summary is once per client per day. A miss is retried 30 minutes later,
      # so this warns instead of failing. No retry - it would double wall time.
      # weekly-digest self-gates to Monday 8-11 Warsaw and dedupes per ISO week,
      # season-pulse to 7-10 Warsaw once a day in a client's season - every
      # other tick is a cheap no-op for both (and neither uses AI).
      - name: AI jobs (news, summary) + weekly digest - best effort
        run: |
          for job in refresh-news generate-summary weekly-digest season-pulse; do
            rm -f /tmp/body
            code=$(curl -sS -m 180 -o /tmp/body -w "%{http_code}" \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$APP_URL/api/cron/$job" 2>/dev/null || echo "000")
            # Status, top-level counts, errors count only (public logs, see the header).
            counts=$(jq -c "$SUMMARY_JQ" /tmp/body 2>/dev/null | head -c 300 || true)
            echo "-> $job: HTTP $code $counts"
            if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
              echo "::warning::$job returned HTTP $code (retried next tick)"
            fi
          done
