name: External cron (data sync + alerts + news)

# Reliable scheduler independent of Vercel Cron. Pings the app's cron endpoints
# with the CRON_SECRET bearer token. Requires two repo secrets:
#   CRON_SECRET   - same value as the Vercel env var
#   APP_URL       - e.g. https://patohelp-two.vercel.app  (optional; defaults below)
#
# ONE schedule on purpose. The previous setup had a second daily cron entry and
# gated the news/summary step on `github.event.schedule == '30 4 * * *'` -
# GitHub coalesces/drops extra schedules on busy workflows, so that step never
# ran and nobody noticed (curl also swallowed HTTP 500s, keeping runs green).
# Now every endpoint is pinged each run and the DAILY routes themselves are
# idempotent per day (refresh-news: one prasówka/day, generated after 6:00 PL;
# generate-summary: one summary per client per day), so the 30-minute cadence
# costs one cheap DB check. A job that still fails after a retry turns the run
# RED so breakage is visible instead of silently going stale for weeks.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}      # manual "Run workflow" button

# No concurrency group on purpose. With one, a tick that arrived while another
# run was still going got QUEUED and then cancelled by the next tick - the
# "All jobs were cancelled" failure alerts. timeout-minutes (12) is far below
# the 30-minute cadence, so runs cannot overlap in practice, and every endpoint
# is idempotent even if they did.

jobs:
  sync:
    runs-on: ubuntu-latest
    # Hard cap well under the 30-minute cadence. Without it a hanging endpoint
    # (curl -m 300, retried) burned 10+ minutes, runs started overlapping the
    # schedule, and the concurrency group then CANCELLED the queued run -
    # the "All jobs were cancelled" notifications.
    timeout-minutes: 12
    env:
      APP_URL: ${{ secrets.APP_URL || 'https://patohelp-two.vercel.app' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Guard - secret present
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repo secret is missing"; exit 1
          fi

      # Fast, idempotent data pulls. These must stay green - a failure here
      # means the dashboard is going stale, so it turns the run red.
      - name: Data sync (ads, ga4, creatives, demographics, alerts)
        run: |
          failed=""
          for job in refresh-ads-meta refresh-ads-google refresh-ads-tiktok \
                     refresh-ga4 refresh-creatives-meta refresh-demographics \
                     evaluate-alerts notify-alerts; do
            ok=""
            for attempt in 1 2; do
              code=$(curl -sS -m 90 -o /tmp/body -w "%{http_code}" \
                -H "Authorization: Bearer $CRON_SECRET" \
                "$APP_URL/api/cron/$job" || echo "000")
              echo "-> $job (attempt $attempt): HTTP $code"
              if [ "$code" -ge 200 ] && [ "$code" -lt 400 ]; then ok=1; break; fi
              echo "   body: $(head -c 300 /tmp/body 2>/dev/null)"
              sleep 5
            done
            if [ -z "$ok" ]; then failed="$failed $job"; fi
          done
          if [ -n "$failed" ]; then
            echo "::error::Data sync failed:$failed"
            exit 1
          fi

      # AI jobs: slower (Claude + web search) and self-healing - each tick fills
      # the next missing news category and the summary is once per client per
      # day. A miss here is retried 30 minutes later, so it warns instead of
      # failing the run. No retry: a second call would double the wall time.
      - name: AI jobs (news, summary) - best effort
        if: always()
        run: |
          for job in refresh-news generate-summary; do
            code=$(curl -sS -m 180 -o /tmp/body -w "%{http_code}" \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$APP_URL/api/cron/$job" || echo "000")
            echo "-> $job: HTTP $code"
            echo "   body: $(head -c 400 /tmp/body 2>/dev/null)"
            if [ "$code" -lt 200 ] || [ "$code" -ge 400 ]; then
              echo "::warning::$job returned HTTP $code (retried next tick)"
            fi
          done
