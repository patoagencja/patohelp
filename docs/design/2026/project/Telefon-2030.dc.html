<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Telefon 2030</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#07080A}
a{color:inherit}a:hover{color:inherit}
.ph{--ink:#F4F3EE;--ink-2:rgba(244,243,238,.74);--ink-3:rgba(244,243,238,.56);--line:rgba(255,255,255,.08);--chip:rgba(255,255,255,.07);--lime:#C6F25C;--lime-ink:#D8FF7A;--lime-glow:rgba(198,242,92,.5);--mint:#7FE0B5;--amber:#FFC56B;--coral:#FF8A6B;position:relative;width:390px;height:844px;overflow:hidden;background:#07080A;color:var(--ink);font-family:'Geist',ui-sans-serif,system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.ph *{box-sizing:border-box}
.mono{font-family:'Geist Mono',monospace}
.blob{position:absolute;border-radius:50%;filter:blur(70px);animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{50%{transform:translate(40px,30px) scale(1.15)}100%{transform:translate(-20px,60px) scale(.95)}}
.scr{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;padding:84px 16px 130px;display:flex;flex-direction:column;gap:16px}
.gl{position:relative;border-radius:28px;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.025));backdrop-filter:blur(26px) saturate(1.5);-webkit-backdrop-filter:blur(26px) saturate(1.5)}
.gl::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(150deg,rgba(255,255,255,.32),rgba(255,255,255,.04) 40%,rgba(198,242,92,.28));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.rise{animation:rise 1s cubic-bezier(.16,1,.3,1) backwards;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(24px);filter:blur(10px)}}
.kick{font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.hero{font-size:76px;font-weight:300;letter-spacing:-.065em;line-height:.9;background:linear-gradient(180deg,#fff 25%,rgba(255,255,255,.45));-webkit-background-clip:text;background-clip:text;color:transparent}
.orbw{position:relative;width:40px;height:40px;flex:none}
.halo{position:absolute;inset:-10px;border-radius:50%;background:conic-gradient(#C6F25C,#7FE0B5,#B9A6FF,#FF8A6B,#C6F25C);filter:blur(14px);opacity:.5;animation:spin 9s linear infinite reverse}
.orb{position:absolute;inset:0;border-radius:50%}
.orb::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(#C6F25C,#7FE0B5,#B9A6FF,#FF8A6B,#C6F25C);animation:spin 5s linear infinite}
.orb::after{content:"";position:absolute;inset:3px;border-radius:50%;background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.95),rgba(255,255,255,.12) 38%,transparent 60%),#0D0E10}
@keyframes spin{to{transform:rotate(360deg)}}
.caret{display:inline-block;width:2px;height:1em;background:var(--lime);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.ib{all:unset;box-sizing:border-box;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--chip);position:relative;cursor:pointer}
.car{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.kc{flex:0 0 168px;scroll-snap-align:start;padding:16px;display:flex;flex-direction:column;gap:10px}
.kc.on{box-shadow:0 0 0 1.5px var(--lime),0 18px 50px -16px var(--lime-glow)}
.kn{font-size:32px;font-weight:300;letter-spacing:-.05em;line-height:1}
.draw{stroke-dasharray:1;animation:draw 2s cubic-bezier(.65,0,.35,1) backwards;animation-delay:var(--d,.6s)}
@keyframes draw{from{stroke-dashoffset:1}}
.ring{fill:none;stroke-linecap:round;animation:ring 2.2s cubic-bezier(.65,0,.35,1) backwards;animation-delay:var(--d,.6s)}
@keyframes ring{from{stroke-dashoffset:100}}
.tabs{position:absolute;left:14px;right:14px;bottom:22px;z-index:10;height:70px;border-radius:999px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:7px}
.tabs .ind{position:absolute;top:7px;bottom:7px;left:7px;width:calc((100% - 14px) / 5);border-radius:999px;background:#F4F3EE;transition:transform .55s cubic-bezier(.34,1.56,.64,1)}
.tab{all:unset;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:500;color:var(--ink-2);cursor:pointer;transition:color .35s;border-radius:999px}
.tab.on{color:#0B0C0E}
.tab:focus-visible,.ib:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
@media (prefers-reduced-motion: reduce){.ph *,.ph *::before,.ph *::after{animation:none!important;transition:none!important}}
</style>
</helmet>
<div class="ph">
<span class="blob" style="width: 420px; height: 360px; left: -140px; top: -160px; background: rgba(166,221,78,.5)"></span>
<span class="blob" style="width: 320px; height: 300px; right: -120px; top: -100px; background: rgba(229,72,47,.32); animation-duration: 28s"></span>
<span class="blob" style="width: 380px; height: 340px; left: 30px; top: 520px; background: rgba(140,110,255,.3); animation-duration: 34s"></span>

<header class="gl" style="position: absolute; z-index: 10; top: 10px; left: 12px; right: 12px; height: 62px; border-radius: 999px; display: flex; align-items: center; gap: 10px; padding: 0 9px 0 16px">
<svg width="24" height="24" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="16" r="10" fill="#E5482F"></circle><path d="M14 7c-2-3-5-2.5-6.5-.5 2.2 0 4.3.8 6.5 2 2.2-1.2 4.3-2 6.5-2C19 4.5 16 4 14 7z" fill="#4C9A2A"></path></svg>
<div style="flex: 1; line-height: 1.15"><b style="display: block; font-size: 15px; font-weight: 600">{{tabName}}</b><span style="font-size: 11.5px; color: var(--ink-3); display: flex; align-items: center; gap: 6px"><span style="width: 6px; height: 6px; border-radius: 50%; background: #3FD15A"></span>na żywo · 5 min temu</span></div>
<button class="ib" type="button" aria-label="Alerty: 3 nowe"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15L6 16z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg><span style="position: absolute; top: 3px; right: 3px; width: 16px; height: 16px; border-radius: 50%; background: #FF8A6B; color: #140705; font-size: 10px; font-weight: 700; display: grid; place-items: center">3</span></button>
<a class="ib" href="Prezentacja-2030.dc.html" aria-label="Prezentuj" style="background: #F4F3EE; color: #0B0C0E"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path><path d="M10.5 8l3.5 2-3.5 2z"></path></svg></a>
</header>

<div class="scr">
<div class="rise" style="--d: .1s; padding: 10px 4px 0; display: flex; flex-direction: column; gap: 12px">
<span class="kick">Ostatnie 30 dni</span>
<div class="hero">{{hero}}<span style="font-size: 28px; letter-spacing: -.02em"> zł</span></div>
<p style="margin: 0; font-size: 19px; line-height: 1.35; letter-spacing: -.02em; color: var(--ink-3)">zamieniło się w <span style="color: var(--ink)">{{clicks}} kliknięć</span> i <span style="color: var(--ink)">{{visits}} wizyt</span>.</p>
</div>

<a class="rise" href="#" style="--d: .25s; display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 8px 8px 14px; border-radius: 20px; background: rgba(255,138,107,.12); text-decoration: none">
<span style="position: relative; width: 10px; height: 10px; border-radius: 50%; background: #FF8A6B; flex: none; box-shadow: 0 0 0 6px rgba(255,138,107,.18)"></span>
<span style="flex: 1; font-size: 14px; line-height: 1.35"><b style="font-weight: 600">Skok wydatków dziś: 1 809 zł</b><br><span style="color: var(--ink-3)">PMAX | Ruch · i jeszcze 1</span></span>
<span class="ib" style="width: 40px; height: 40px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
</a>

<section class="gl rise" style="--d: .35s; padding: 18px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 12px"><div class="orbw"><span class="halo"></span><span class="orb"></span></div><div><b style="font-size: 15px; font-weight: 600">Claude</b><div style="font-size: 12px; color: var(--ink-3)">Komentarz tygodnia</div></div></div>
<p style="margin: 0; font-size: 15.5px; line-height: 1.5; min-height: 92px">{{typed}}<span class="caret"></span></p>
<button type="button" style="all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 10px; min-height: 50px; padding: 4px 4px 4px 16px; border-radius: 999px; background: var(--chip); font-size: 14px; color: var(--ink-3); cursor: text">Zapytaj o swoje dane…<span style="flex: 1"></span><span style="width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: #C6F25C; color: #121A05"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"></path></svg></span></button>
</section>

<div class="car rise" style="--d: .45s">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="4">
<button class="{{t.cls}}" type="button" onClick="{{t.pick}}" aria-pressed="{{t.pressed}}" style="all: unset; box-sizing: border-box; cursor: pointer">
<div class="{{t.inner}}">
<span class="kick" style="font-size: 10px">{{t.label}}</span>
<span class="kn">{{t.num}}</span>
<svg width="136" height="30" viewBox="0 0 136 30" preserveAspectRatio="none" aria-hidden="true" style="overflow: visible"><path d="{{t.spark}}" pathLength="1" class="draw" fill="none" stroke="{{t.col}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="--d: {{t.d}}"></path></svg>
<span style="font-size: 12.5px; font-weight: 600; color: {{t.dcol}}">{{t.delta}}</span>
</div>
</button>
</sc-for>
</div>

<section class="gl rise" style="--d: .55s; padding: 18px; display: flex; gap: 16px; align-items: center">
<svg width="128" height="128" viewBox="0 0 260 260" role="img" aria-label="Plan: budżet 18%, wizyty 17%, kliknięcia 14%" style="flex: none">
<g transform="rotate(-90 130 130)">
<circle cx="130" cy="130" r="110" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="26"></circle><circle cx="130" cy="130" r="80" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="26"></circle><circle cx="130" cy="130" r="50" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="26"></circle>
<circle class="ring" cx="130" cy="130" r="110" stroke="#C6F25C" stroke-width="26" pathLength="100" stroke-dasharray="100 100" style="stroke-dashoffset: 82; --d: .8s"></circle>
<circle class="ring" cx="130" cy="130" r="80" stroke="#7FE0B5" stroke-width="26" pathLength="100" stroke-dasharray="100 100" style="stroke-dashoffset: 83; --d: .95s"></circle>
<circle class="ring" cx="130" cy="130" r="50" stroke="#FFC56B" stroke-width="26" pathLength="100" stroke-dasharray="100 100" style="stroke-dashoffset: 86; --d: 1.1s"></circle>
</g>
</svg>
<div style="flex: 1; display: flex; flex-direction: column; gap: 10px; font-size: 14px">
<span class="kick" style="font-size: 10px">Plan · dzień 6 z 31</span>
<div style="display: flex; justify-content: space-between"><span><span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #C6F25C; margin-right: 8px"></span>Budżet</span><b style="font-weight: 500">{{r1}}%</b></div>
<div style="display: flex; justify-content: space-between"><span><span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #7FE0B5; margin-right: 8px"></span>Wizyty</span><b style="font-weight: 500">{{r2}}%</b></div>
<div style="display: flex; justify-content: space-between"><span><span style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #FFC56B; margin-right: 8px"></span>Kliknięcia</span><b style="font-weight: 500; color: #FFC56B">{{r3}}%</b></div>
</div>
</section>
</div>

<nav class="tabs gl" aria-label="Zakładki">
<span class="ind" style="transform: translateX({{tabX}})"></span>
<sc-for list="{{tabs}}" as="b" hint-placeholder-count="5"><button class="{{b.cls}}" type="button" onClick="{{b.pick}}" aria-current="{{b.cur}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{b.icon}}"></path></svg>{{b.label}}</button></sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { tick: 0, tab: 0, metric: 0 };
  componentDidMount() { this.iv = setInterval(() => this.setState((s) => ({ tick: s.tick + 1 })), 50); }
  componentWillUnmount() { clearInterval(this.iv); }
  sp(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
  ease(t) { const c = Math.min(1, Math.max(0, t)); return 1 - Math.pow(1 - c, 4); }
  renderVals() {
    const t = this.state.tick, p = this.ease(t / 30);
    const text = 'Kliknięć jest o 16% więcej, a jedno kliknięcie kosztuje 7% mniej. Najmocniej ciągnie film „Poradnik montażu”.';
    const series = [
      [12,14,13,14,15,12,12,16,15,15,14,13,12,15,16,15,17,16,13,13,16,16,18,16,17,12,12,18,17,18],
      [13,14,13,14,15,12,12,17,15,16,15,13,12,16,18,16,19,18,13,13,17,18,21,18,19,13,13,21,19,20],
      [10,11,10,11,12,10,10,13,12,13,12,10,9,13,14,13,15,14,11,11,14,14,17,14,15,10,11,17,15,16],
      [99,101,98,100,97,99,102,96,97,95,96,98,100,94,92,93,91,92,95,96,93,91,86,90,89,93,94,88,90,92]
    ];
    const T = [
      { label: 'Wydatki', num: this.sp(Math.round(43885 * p)) + ' zł', delta: '↗ 11% więcej', dcol: 'var(--ink-2)' },
      { label: 'Kliknięcia', num: this.sp(Math.round(46320 * p)), delta: '↗ 16% więcej', dcol: 'var(--lime-ink)' },
      { label: 'Wizyty', num: this.sp(Math.round(36586 * p)), delta: '↗ 20% więcej', dcol: 'var(--lime-ink)' },
      { label: 'Koszt kliknięcia', num: (0.95 * p).toFixed(2).replace('.', ',') + ' zł', delta: '↘ 7% taniej', dcol: 'var(--lime-ink)' }
    ];
    const tiles = T.map((x, i) => {
      const s = series[i], mn = Math.min(...s), mx = Math.max(...s);
      const d = s.map((v, j) => (j ? 'L' : 'M') + (j * 136 / 29).toFixed(1) + ' ' + (28 - (v - mn) / (mx - mn) * 26).toFixed(1)).join(' ');
      const on = i === this.state.metric;
      return { ...x, spark: d, cls: '', inner: 'gl kc' + (on ? ' on' : ''), pressed: String(on), col: on ? '#C6F25C' : 'rgba(244,243,238,.5)', d: (0.7 + i * 0.12) + 's', pick: () => this.setState({ metric: i }) };
    });
    const TB = [
      { label: 'Przegląd', icon: 'M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z' },
      { label: 'Sprzedaż', icon: 'M5 8h14l-1 12H6L5 8zM9 8V6a3 3 0 0 1 6 0v2' },
      { label: 'Reklamy', icon: 'M3 10v4h3l7 4V6l-7 4H3zM17 9a4 4 0 0 1 0 6' },
      { label: 'Strona', icon: 'M12 3a9 9 0 1 0 0 18a9 9 0 0 0 0-18zM3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18' },
      { label: 'Więcej', icon: 'M5 12h.01M12 12h.01M19 12h.01' }
    ];
    return {
      hero: this.sp(Math.round(43885 * p)), clicks: this.sp(Math.round(46320 * p)), visits: this.sp(Math.round(36586 * p)),
      typed: text.slice(0, Math.max(0, (t - 20) * 2)),
      tiles, r1: Math.round(18 * p), r2: Math.round(17 * p), r3: Math.round(14 * p),
      tabName: TB[this.state.tab].label, tabX: (this.state.tab * 100) + '%',
      tabs: TB.map((b, i) => ({ ...b, cls: 'tab' + (i === this.state.tab ? ' on' : ''), cur: i === this.state.tab ? 'page' : 'false', pick: () => this.setState({ tab: i }) }))
    };
  }
}
</script>
</body>
</html>
